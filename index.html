<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>私有短视频平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999}
.modal-box{width:85%;max-width:360px;background:#111;border-radius:16px;padding:26px}
.modal-box h2{text-align:center;margin-bottom:20px;font-size:22px}
.input{width:100%;padding:12px 14px;margin:8px 0;border:1px solid #333;border-radius:8px;background:#222;color:#fff;font-size:16px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;font-size:16px;cursor:pointer}
.btn-primary{background:#fe2c55;color:#fff}
.btn-gray{background:#333;color:#fff}
.tip{text-align:center;margin-top:12px;color:#aaa;font-size:14px}
.tip span{color:#fe2c55;cursor:pointer}
.hide{display:none}
.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.video-item{height:100vh;width:100vw;scroll-snap-align:start;position:relative}
video{width:100%;height:100%;object-fit:cover;background:#000}
.side{position:absolute;right:14px;bottom:180px;display:flex;flex-direction:column;gap:22px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#333}
.side-btn{text-align:center;font-size:24px;cursor:pointer}
.side-btn small{display:block;font-size:12px;margin-top:4px}
.info{position:absolute;left:16px;bottom:40px;width:calc(100% - 90px)}
.info h4{font-size:16px;margin-bottom:6px}
.info p{font-size:14px;opacity:0.9;line-height:1.5}
.music{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:6px}
.follow{border:1px solid #fff;padding:3px 10px;border-radius:4px;font-size:12px;margin-left:8px;cursor:pointer}
.top-bar{position:fixed;top:0;left:0;width:100%;padding:14px 16px;display:flex;justify-content:space-between;z-index:90}
.upload-btn{background:#fe2c55;padding:6px 12px;border-radius:6px;font-size:14px;cursor:pointer}
.chat-btn{background:#2563eb;padding:6px 12px;border-radius:6px;font-size:14px;margin-left:6px;cursor:pointer}
/* 聊天弹窗 */
.chat-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:400px;height:70vh;background:#111;border-radius:14px;z-index:998;display:none;flex-direction:column;overflow:hidden}
.chat-head{padding:12px;background:#222;display:flex;justify-content:space-between;align-items:center}
.chat-content{flex:1;padding:12px;overflow-y:auto}
.msg{margin:6px 0;max-width:70%;padding:8px 10px;border-radius:8px;font-size:14px}
.msg-me{background:#fe2c55;margin-left:auto}
.msg-other{background:#333}
.chat-input{display:flex;padding:10px;gap:6px}
.chat-input input{flex:1;padding:10px;border-radius:8px;border:none;background:#222;color:#fff}
.chat-input button{padding:0 14px;border:none;border-radius:8px;background:#fe2c55;color:#fff}
</style>
</head>
<body>
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2 id="formTitle">登录</h2>
    <input class="input" id="username" placeholder="用户名">
    <input class="input" id="pwd" type="password" placeholder="密码">
    <button class="btn btn-primary" id="submitBtn">登录</button>
    <div class="tip" id="switchTip">没有账号？<span id="switchBtn">去注册</span></div>
  </div>
</div>

<div class="top-bar hide" id="topBar">
  <div class="user-name" id="showUser"></div>
  <div>
    <label class="upload-btn">
      +上传视频
      <input type="file" id="videoFile" accept="video/mp4" style="display:none">
    </label>
    <button class="chat-btn" onclick="openChat()">聊天</button>
    <button class="btn-gray" onclick="logout()" style="padding:4px 8px;margin-left:6px;font-size:13px">退出</button>
  </div>
</div>

<div class="feed hide" id="feedWrap"></div>

<!-- 聊天弹窗 -->
<div class="chat-box" id="chatBox">
  <div class="chat-head">
    <span id="chatToName">聊天</span>
    <button onclick="closeChat()">关闭</button>
  </div>
  <div class="chat-content" id="chatContent"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="输入消息">
    <button onclick="sendMsg()">发送</button>
  </div>
</div>

<script>
let baseUrl = "";
let isRegister = false;
let me = null;
let currentChatUid = null;

const loginModal = document.getElementById("loginModal");
const feedWrap = document.getElementById("feedWrap");
const topBar = document.getElementById("topBar");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switchBtn");
const switchTip = document.getElementById("switchTip");
const usernameInput = document.getElementById("username");
const pwdInput = document.getElementById("pwd");
const showUser = document.getElementById("showUser");
const videoFile = document.getElementById("videoFile");
const chatBox = document.getElementById("chatBox");
const chatContent = document.getElementById("chatContent");
const chatInput = document.getElementById("chatInput");
const chatToName = document.getElementById("chatToName");

// 检查登录状态
async function checkLogin(){
  const res = await fetch(baseUrl + "/me");
  const data = await res.json();
  if(data.login){
    me = data;
    loginModal.classList.add("hide");
    topBar.classList.remove("hide");
    feedWrap.classList.remove("hide");
    showUser.innerText = "👤 "+me.username;
    loadVideos();
  }
}

switchBtn.onclick = ()=>{
  isRegister = !isRegister;
  if(isRegister){
    formTitle.innerText = "注册账号";
    submitBtn.innerText = "注册";
    switchTip.innerHTML = "已有账号？<span>去登录</span>";
  }else{
    formTitle.innerText = "登录";
    submitBtn.innerText = "登录";
    switchTip.innerHTML = "没有账号？<span>去注册</span>";
  }
}

submitBtn.onclick = async ()=>{
  const u = usernameInput.value.trim();
  const p = pwdInput.value.trim();
  if(!u||!p){alert("不能为空");return}
  if(isRegister){
    const r = await fetch(baseUrl+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const d = await r.json();
    if(!d.ok) alert(d.msg);
    else {alert("注册成功");isRegister=false;formTitle.innerText="登录";submitBtn.innerText="登录";switchTip.innerHTML="没有账号？<span>去注册</span>";}
  }else{
    const r = await fetch(baseUrl+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const d = await r.json();
    if(!d.ok) alert(d.msg);
    else {me = d; loginModal.classList.add("hide");topBar.classList.remove("hide");feedWrap.classList.remove("hide");showUser.innerText="👤 "+me.username;loadVideos();}
  }
}

async function logout(){
  await fetch(baseUrl+"/logout",{method:"POST"});
  me=null;loginModal.classList.remove("hide");topBar.classList.add("hide");feedWrap.classList.add("hide");
}

// 上传视频
videoFile.onchange = async e=>{
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append("video",file);
  fd.append("uid",me.uid);
  fd.append("desc","作品描述");
  await fetch(baseUrl+"/upload",{method:"POST",body:fd});
  loadVideos();
}

async function loadVideos(){
  const r = await fetch(baseUrl+"/videos");
  const list = await r.json();
  feedWrap.innerHTML="";
  for(const item of list){
    const div = document.createElement("div");
    div.className="video-item";
    const followRes = await fetch(baseUrl+`/isfollow?from=${me.uid}&to=${item.uid}`);
    const fdata = await followRes.json();
    div.innerHTML=`
    <video src="${item.src}" autoplay muted loop playsinline></video>
    <div class="side">
      <div class="avatar"></div>
      <div class="side-btn" onclick="like(${item.id})">❤️<small>${item.likes}</small></div>
      <div class="side-btn">💬<small>0</small></div>
      <div class="side-btn" onclick="startChat(${item.uid},'${item.username}')">✉️</div>
    </div>
    <div class="info">
      <h4>@${item.username}<span class="follow" onclick="follow(${item.uid},this)">${fdata.is?'已关注':'关注'}</span></h4>
      <p>${item.desc}</p>
      <div class="music">🎵 原声</div>
    </div>
    `
    feedWrap.appendChild(div);
  }
}

async function like(vid){
  await fetch(baseUrl+"/like",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vid})});
  loadVideos();
}

async function follow(toUid,dom){
  await fetch(baseUrl+"/follow",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:me.uid,to:toUid})});
  dom.innerText="已关注";
}

// 聊天
function openChat(){chatBox.style.display="flex";}
function closeChat(){chatBox.style.display="none";}
function startChat(uid,name){
  currentChatUid = uid;
  chatToName.innerText = name;
  openChat();
  loadMsg();
}
async function loadMsg(){
  const r = await fetch(baseUrl+`/msgs?a=${me.uid}&b=${currentChatUid}`);
  const msgs = await r.json();
  chatContent.innerHTML="";
  msgs.forEach(m=>{
    const d = document.createElement("div");
    d.className = m.from_uid == me.uid ? "msg msg-me" : "msg msg-other";
    d.innerText = m.content;
    chatContent.appendChild(d);
  })
  chatContent.scrollTop = chatContent.scrollHeight;
}
async function sendMsg(){
  const txt = chatInput.value.trim();
  if(!txt) return;
  await fetch(baseUrl+"/sendmsg",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:me.uid,to:currentChatUid,content:txt})});
  chatInput.value="";
  loadMsg();
}

checkLogin();
</script>
</body>
</html>
